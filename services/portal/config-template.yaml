base:
  redis:
    host: redis
    port: 6379
    password: local-redis
  db: mongodb://makyek:makyek@mongo:27017/db
  secret: local-development-secret-change-me
  port: 8888
  host: localhost:8888
  cspReportUrl: /
  urlPrefix: ''
  cdnPrefix: ''
  scoreboard:
    cacheDuration: 10000
  web:
    realtimePush: true
  api:
    credential:
      username: judge
      password: local-judge-secret
  compile:
    display:
      gcc51c11: GCC (Linux, C11)
      gpp10cpp17: G++ (Linux, C++17)
    limits:
      sizeOfCode: 1048576
      sizeOfBin: 1048576
      sizeOfText: 102400
      submitInterval: 300000
      minSubmitInterval: 1000
      maxExecQuota: 36000000
  match:
    rules:
      moveTimeout: 2000
      roundTimeout: 90000
      memoryLimit: 367001600
      size: 12
      roundLlimit: 60
  profiling:
    eventBus: false
    addMatches: false
  mq:
    vhosts:
      /:
        connection:
          hostname: rabbit
          user: root
          password: local-rabbit
        queues:
          - reversi_compile
          - reversi_judge
        publications:
          compile:
            queue: reversi_compile
          judge:
            queue: reversi_judge
